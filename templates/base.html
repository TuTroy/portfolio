<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0ea5e9">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.5.0/theme-chalk/index.css">
  <style>
    :root {
      --bg:#f7f9fc; --surface:#fff; --surface2:#f0f4f8; --border:#e4e9f0;
      --accent:#0ea5e9; --accent-light:rgba(14,165,233,.08); --accent-dark:#0284c7;
      --text:#0f172a; --text2:#334155; --muted:#94a3b8;
      --radius:20px;
      --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
      --shadow-hover:0 8px 32px rgba(14,165,233,.12);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    ::selection{background:rgba(14,165,233,.15)}

    nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:22px 48px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(24px);background:rgba(247,249,252,.85);border-bottom:1px solid var(--border);transition:all .4s ease}
    nav.scrolled{padding:14px 48px;box-shadow:var(--shadow)}
    .nav-logo{font-size:17px;font-weight:800;letter-spacing:-.3px}
    .nav-links{display:flex;gap:36px;list-style:none}
    .nav-links a{font-size:14px;font-weight:500;color:var(--text2);transition:color .3s}
    .nav-links a:hover{color:var(--accent)}
    .nav-cta{font-size:13px;font-weight:600;background:var(--accent);color:#fff;padding:10px 20px;border-radius:50px;transition:all .3s;display:inline-block}
    .nav-cta:hover{background:var(--accent-dark);transform:translateY(-2px)}

    .container{max-width:1000px;margin:0 auto;padding:0 32px}
    section{padding:80px 0}
    .section-label{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
    .section-title{font-size:32px;font-weight:800;letter-spacing:-.5px;margin-bottom:48px}

    /* HERO */
    .hero{padding:140px 0 80px;position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;top:-200px;right:-100px;width:600px;height:600px;background:radial-gradient(circle,rgba(14,165,233,.07) 0%,transparent 70%);pointer-events:none}
    .hero::after{content:'';position:absolute;bottom:-150px;left:-80px;width:500px;height:500px;background:radial-gradient(circle,rgba(74,222,128,.05) 0%,transparent 70%);pointer-events:none}
    .hero-inner{max-width:680px;position:relative;z-index:1}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:50px;background:var(--accent-light);border:1px solid rgba(14,165,233,.15);font-size:13px;font-weight:600;color:var(--accent-dark);margin-bottom:24px}
    .hero-badge span{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
    .hero h1{font-size:60px;font-weight:900;line-height:1.05;letter-spacing:-2px;margin-bottom:20px}
    .hero h1 .accent{color:var(--accent)}
    .hero-desc{font-size:18px;color:var(--text2);line-height:1.85;margin-bottom:32px;max-width:560px}
    .hero-tags{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px}
    .tag{padding:7px 16px;border-radius:50px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:500;color:var(--text2);transition:all .2s}
    .tag:hover{border-color:var(--accent);color:var(--accent)}
    .hero-buttons{display:flex;gap:14px;margin-bottom:56px}
    .btn{padding:14px 28px;border-radius:50px;font-size:14px;font-weight:700;transition:all .3s;cursor:pointer;display:inline-block}
    .btn-primary{background:var(--accent);color:#fff;border:none}
    .btn-primary:hover{background:var(--accent-dark);transform:translateY(-3px);box-shadow:0 8px 24px rgba(14,165,233,.35)}
    .btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text2)}
    .btn-outline:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-3px)}
    .hero-stats{display:flex;gap:56px}
    .stat-num{font-size:42px;font-weight:900;letter-spacing:-1.5px;color:var(--text);line-height:1}
    .stat-label{font-size:13px;color:var(--muted);margin-top:6px}
    .stat-item:first-child .stat-num{color:var(--accent)}

    /* ABOUT */
    #about{background:var(--surface)}
    .about-grid{display:grid;grid-template-columns:200px 1fr;gap:56px;align-items:center}
    .about-img-inner{width:180px;height:180px;border-radius:28px;background:linear-gradient(135deg,#e0f2fe,#bae6fd);display:flex;align-items:center;justify-content:center;font-size:64px;box-shadow:0 8px 32px rgba(14,165,233,.15);position:relative}
    .about-img-inner::after{content:'';position:absolute;inset:-4px;border-radius:32px;background:linear-gradient(135deg,rgba(14,165,233,.2),rgba(74,222,128,.15));z-index:-1}
    .about-text p{font-size:15px;color:var(--text2);margin-bottom:16px;line-height:1.9}
    .about-highlights{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:24px}
    .hl-item{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;font-size:14px;font-weight:500;transition:all .25s}
    .hl-item:hover{border-color:var(--accent);transform:translateX(4px)}
    .hl-icon{font-size:18px}

    /* ROADMAP */
    .roadmap-intro{background:linear-gradient(135deg,rgba(14,165,233,.04),rgba(74,222,128,.03));border:1px solid rgba(14,165,233,.1);border-radius:var(--radius);padding:28px 32px;margin-bottom:32px}
    .roadmap-intro h3{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .roadmap-intro p{color:var(--text2);font-size:14px;line-height:1.85}
    .roadmap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .roadmap-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:all .3s ease;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .roadmap-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-dark));opacity:0;transition:opacity .3s}
    .roadmap-card:hover{border-color:rgba(14,165,233,.3);transform:translateY(-4px);box-shadow:var(--shadow-hover)}
    .roadmap-card:hover::before{opacity:1}
    .roadmap-card .step{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--accent);margin-bottom:8px;text-transform:uppercase}
    .roadmap-card h4{font-size:15px;font-weight:700;margin-bottom:12px}
    .roadmap-card ul{list-style:none;font-size:13px;color:var(--text2)}
    .roadmap-card ul li{padding:4px 0;padding-left:16px;position:relative}
    .roadmap-card ul li::before{content:'→';position:absolute;left:0;color:var(--accent);font-size:10px;top:5px}

    /* SKILLS */
    #skills{background:var(--surface)}
    .skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .skill-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px 22px;transition:all .35s ease;cursor:default;box-shadow:var(--shadow)}
    .skill-card:hover{border-color:rgba(14,165,233,.3);transform:translateY(-5px);box-shadow:0 12px 40px rgba(14,165,233,.12)}
    .skill-icon{width:44px;height:44px;border-radius:12px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
    .skill-name{font-size:15px;font-weight:700;margin-bottom:5px}
    .skill-desc{font-size:12px;color:var(--muted);margin-bottom:14px}
    .skill-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
    .skill-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent-dark),var(--accent));width:0;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
    .skill-pct{font-size:11px;color:var(--accent);margin-top:8px;font-weight:700}

    /* PROJECTS */
    .projects-filter{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
    .filter-btn{padding:8px 16px;border-radius:50px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .3s}
    .filter-btn:hover,.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .projects-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
    .project-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .35s ease;box-shadow:var(--shadow);display:flex;flex-direction:column}
    .project-card:hover{border-color:rgba(14,165,233,.25);transform:translateY(-6px);box-shadow:var(--shadow-hover)}
    .project-thumb{height:190px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(135deg,#e0f2fe,#bae6fd);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden}
    .project-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.03))}
    .project-badge{position:absolute;top:14px;left:14px;padding:4px 10px;border-radius:50px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
    .badge-external{background:rgba(14,165,233,.12);color:var(--accent-dark);border:1px solid rgba(14,165,233,.2)}
    .badge-local{background:rgba(74,222,128,.12);color:#16a34a;border:1px solid rgba(74,222,128,.2)}
    .project-link-icon{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0;transform:scale(.8);transition:all .3s}
    .project-card:hover .project-link-icon{opacity:1;transform:scale(1)}
    .project-body{padding:24px;flex:1;display:flex;flex-direction:column}
    .project-title{font-size:16px;font-weight:700;margin-bottom:8px}
    .project-desc{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.75;flex:1}
    .project-metrics{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .metric{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:50px;background:rgba(14,165,233,.08);border:1px solid rgba(14,165,233,.12);font-size:11px;font-weight:700;color:var(--accent-dark)}
    .metric.green{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.15);color:#16a34a}
    .project-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
    .ptag{padding:3px 10px;border-radius:50px;background:var(--accent-light);border:1px solid rgba(14,165,233,.12);font-size:11px;color:var(--accent-dark);font-weight:600}
    .project-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
    .proj-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;transition:gap .3s}
    .proj-link.external{color:var(--accent)}
    .proj-link.local{color:#16a34a}
    .proj-link:hover{gap:10px}

    /* BLOGS */
    #blogs{background:var(--surface)}
    .blogs-list{display:flex;flex-direction:column;gap:14px}
    .blog-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;transition:all .35s;display:block;box-shadow:var(--shadow)}
    .blog-item:hover{border-color:rgba(14,165,233,.25);transform:translateX(8px);box-shadow:var(--shadow-hover)}
    .blog-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .blog-title{font-size:15px;font-weight:700}
    .blog-arrow{font-size:18px;color:var(--muted);transition:all .3s}
    .blog-item:hover .blog-arrow{color:var(--accent);transform:translateX(4px)}
    .blog-meta{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:10px}
    .blog-meta span{display:flex;align-items:center;gap:4px}
    .blog-desc{font-size:13px;color:var(--muted);line-height:1.7}

    /* CONTACT */
    .contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:56px;align-items:start}
    .contact-info p{color:var(--text2);font-size:15px;margin-bottom:32px;line-height:1.9}
    .contact-links{display:flex;flex-direction:column;gap:12px}
    .contact-item{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;transition:all .3s;font-size:14px;font-weight:500;box-shadow:var(--shadow)}
    .contact-item:hover{border-color:rgba(14,165,233,.3);transform:translateX(6px);box-shadow:var(--shadow-hover)}
    .ci-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .contact-form-wrapper{width:100%}

    /* FOOTER */
    footer{padding:48px 0;text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--border);position:relative;z-index:1}
    .socials{display:flex;justify-content:center;gap:24px;margin-bottom:20px}
    .socials a{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .3s;box-shadow:var(--shadow)}
    .socials a:hover{border-color:var(--accent);background:var(--accent-light);transform:translateY(-3px)}

    /* ANIMATION */
    .reveal{opacity:0;transform:translateY(30px);transition:all .8s cubic-bezier(.4,0,.2,1)}
    .reveal.visible{opacity:1;transform:translateY(0)}

    /* MOBILE */
    @media(max-width:768px){
      nav{padding:16px 24px}
      .nav-links,.nav-cta-wrap{display:none}
      section{padding:60px 0}
      .hero{padding:120px 0 60px}
      .hero h1{font-size:36px;letter-spacing:-1px}
      .hero-stats{grid-template-columns:1fr;gap:24px}
      .about-grid{grid-template-columns:1fr;gap:28px}
      .skills-grid,.projects-grid,.roadmap-grid{grid-template-columns:1fr}
      .contact-grid{grid-template-columns:1fr;gap:28px}
      .about-highlights{grid-template-columns:1fr}
      .hero-desc{font-size:16px}
    }
  </style>
</head>
<body>

<nav id="navbar">
  <div class="nav-logo">{{ name }}</div>
  <ul class="nav-links">
    <li><a href="#about">关于</a></li>
    <li><a href="#transition">转型路线</a></li>
    <li><a href="#skills">技能</a></li>
    <li><a href="#projects">项目</a></li>
    <li><a href="#blogs">文章</a></li>
    <li><a href="#contact">联系</a></li>
  </ul>
  <a href="mailto:{{ email }}" class="nav-cta">✉️ 联系我</a>
</nav>

{% block content %}{% endblock %}

<footer>
  <div class="socials">
    <a href="#" title="GitHub">🐙</a>
  </div>
  <p>© {{ year }} {{ name }} · {{ title }}</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.5.0/dist/index.full.min.js"></script>
{% block scripts %}{% endblock %}

</body>
</html>
