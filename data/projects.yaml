  # === 大数据项目示例 ===

  - id: data-warehouse
    type: local
    title: 电商数据仓库建设
    desc: 基于 Hadoop 生态搭建离线数仓，覆盖用户、商品、订单三大主题域，日处理数据量千万级，为上层数据分析与算法模型提供统一数据底座。
    thumb: 🏗️
    metrics:
      - value: 千万级日处理量
        highlight: true
      - value: 3 大主题域
        highlight: false
      - value: 数据时效 T+1
        highlight: false
    tags:
      - Hadoop
      - Hive
      - Spark
      - Sqoop
      - Kafka
      - Azkaban
    status: 已完成
    year: 2024
    overview: |
      基于 Hadoop 生态系统搭建企业级离线数据仓库，覆盖用户、商品、订单三大主题域。
      通过统一数据底座，支持上层 BI 报表、数据分析和算法模型的数据需求。
    architecture:
      - 数据源：业务数据库(MySQL/Oracle) + 日志数据(Flume/Kafka)
      - 存储：HDFS分布式存储
      - 计算：Hive离线计算 + Spark实时计算
      - 调度：Azkaban 工作流编排
      - 同步：Sqoop 批量抽取 + DataX 实时同步
    achievements:
      - 覆盖用户、商品、订单三大主题域
      - 日处理数据量千万级
      - 下游支持 10+ 数据分析需求
