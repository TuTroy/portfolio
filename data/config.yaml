about_paragraphs:
  - 我是涂炎钊，一名有5年经验的数据分析师，目前在电商/金融科技行业。过去的工作让我积累了丰富的数据清洗、可视化、业务洞察经验。
  - 2025年开始，我意识到AI正在改变数据分析的边界，于是开始系统性学习大模型应用：Prompt工程、RAG检索增强、AI Agent工作流设计、向量数据库、模型微调。
  - 我的目标是成为既懂数据又懂AI的复合型人才，用AI提升数据分析效率，用数据思维指导AI应用落地。

